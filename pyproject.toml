[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-rag"
version = "0.1.0"
description = "Dual-core policy RAG over Coforge PDFs"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5.0",
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0.0"]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: needs Ollama running locally",
]
